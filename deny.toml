# cargo-deny policy (spec U3 step 4, DoD).
# Rejects yanked, vulnerable, and copyleft-incompatible dependencies.
# Note: in advisories `version = 2`, vulnerabilities are denied unconditionally
# (the old `vulnerability` key was removed), so only `yanked`/`unmaintained` are set here.

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licenses + the project's own EUPL-1.2. Anything copyleft-incompatible
# (GPL-only, AGPL, etc.) is absent from the list and therefore rejected.
allow = [
    "EUPL-1.2",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # CC0-1.0: Creative Commons Zero (public domain dedication).
    # Used by: notify v6.x (filesystem event crate, spec 06).
    # Evaluation: CC0-1.0 is a public-domain dedication; it imposes no
    # restrictions whatsoever, making it fully compatible with EUPL-1.2
    # distribution.  FSF and SPDX both classify it as a free/libre license.
    "CC0-1.0",
    # MPL-2.0: Mozilla Public License 2.0 (weak, file-level copyleft).
    # Used by: option-ext (transitive via directories → dirs-sys), which resolves
    # the XDG global plugins directory ($XDG_DATA_HOME / ~/.local/share).
    # Evaluation: MPL-2.0 is FSF/SPDX-recognized free software. Its copyleft is
    # per-file and only triggers on modification of MPL-covered files; we consume
    # the crate unmodified, so it imposes no obligation beyond attribution and is
    # compatible with EUPL-1.2 distribution.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies (e.g. the `core_engine` self dev-dep and the
# extensions' `extension_protocol`/`test_helper` path deps) carry no version req and
# would otherwise be flagged as wildcards. Path deps are resolved from the local tree,
# not a registry, so they pose no supply-chain wildcard risk — exempt them.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
