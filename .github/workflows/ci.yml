name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain channel, components, and targets are pinned by rust-toolchain.toml (spec U2).
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      # Quality gate, run in the order mandated by spec U3.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors — spec UN1)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build plugin_ast for wasm32-wasip1 (spec AC4)
        run: cargo build -p plugin_ast --target wasm32-wasip1

      - name: Build hello_plugin for wasm32-wasip1 (spec 11a AC1/OP1)
        run: cargo build -p hello_plugin --target wasm32-wasip1

      - name: License & advisory policy
        uses: EmbarkStudios/cargo-deny-action@v2
