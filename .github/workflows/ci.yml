name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain channel, components, and targets are pinned by rust-toolchain.toml (spec U2).
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      # Quality gate, run in the order mandated by spec U3.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors — spec UN1)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build wasm fixtures BEFORE `cargo test` so integration tests can find them.
      # build.rs sets HELLO_PLUGIN_WASM / ABI_MISMATCH_WASM env paths but does NOT
      # compile the fixtures (cargo-in-cargo deadlock — see build.rs Decision comment).
      - name: Build wasm fixtures (spec 11c AC1/AC3/AC4)
        run: cargo build -p hello_plugin -p fixture_abi_mismatch --target wasm32-wasip1

      - name: Build plugin_ast for wasm32-wasip1 (spec AC4)
        run: cargo build -p plugin_ast --target wasm32-wasip1

      - name: Test
        run: cargo test --workspace --exclude hello_plugin --exclude plugin_ast --exclude fixture_abi_mismatch

      - name: License & advisory policy
        uses: EmbarkStudios/cargo-deny-action@v2
