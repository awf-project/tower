name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Toolchain channel, components, and targets are pinned by rust-toolchain.toml (spec U2).
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Quality gate, run in the order mandated by spec U3.
      #
      # Since the extension-system migration (spec 20) the engine is a single
      # static binary with out-of-process *native* sidecar extensions. There is
      # no WASM build step and no WASI SDK. Build workspace binaries explicitly
      # before tests so host integration tests can spawn sidecars from
      # target/debug/.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors — spec UN1)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: |
          cargo build --workspace --bins
          cargo test --workspace

      - name: License & advisory policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
