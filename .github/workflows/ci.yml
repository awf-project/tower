name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain channel, components, and targets are pinned by rust-toolchain.toml (spec U2).
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      # Quality gate, run in the order mandated by spec U3.
      #
      # Since the extension-system migration (spec 20) the engine is a single
      # static binary with out-of-process *native* sidecar extensions. There is
      # no WASM build step and no WASI SDK: `cargo test --workspace` compiles
      # every native extension binary, and the host integration tests locate them
      # under target/debug/.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors — spec UN1)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: License & advisory policy
        uses: EmbarkStudios/cargo-deny-action@v2
