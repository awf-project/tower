[package]
name = "core_engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "core_engine"
path = "src/lib.rs"

[[bin]]
name = "tower"
path = "src/main.rs"

[features]
# Expose test-support helpers (contract test macros, in-memory fakes) to other
# crates. Never enable in production builds.
# Decision: feature gate rather than a separate crate to avoid circular deps.
# Trade-off: callers must opt-in; the feature is not automatically enabled.
testing = []

[dev-dependencies]
# Property-based testing: generates arbitrary inputs to verify invariants over
# a large random search space (DoD: determinism property test).
proptest = "1"
tempfile = "3.27.0"
# Self-dependency with `testing` feature so integration tests in tests/ can use
# test-only helpers like `FileId::new_for_testing` (gated on that feature).
core_engine = { path = ".", features = ["testing"] }
# rmcp client feature used in mcp handler unit tests (in-process duplex transport).
rmcp = { version = "1.7.0", features = ["server", "client", "transport-io"] }

[dependencies]
# Decision: extension_protocol provides the ExtensionManifest, ExtensionFault,
# ToolDecl, EventKind, and Event types used by the domain extension host (spec 22).
# It is pure (no process/fs/transport), so importing it here does NOT cross the
# hexagonal boundary.
extension_protocol = { path = "../extension_protocol", version = "0.1.0" }

# Decision: rayon for work-stealing parallelism in domain/grep (spec 07 U1).
# Why: pure CPU parallelism over in-memory data — no I/O API surface. Rayon
# does not cross the hexagonal boundary; it is the same class of dep as
# std::collections or itertools.
# Trade-off: ~300 KB static link vs. a manual thread pool. MIT/Apache-2.0 licensed.
rayon = "1"

# Decision: ignore crate for directory walking.
# Why: ripgrep's ignore crate handles .gitignore patterns, hidden files (dot-prefix),
# and symlink-loop detection in one dependency. The alternative (walkdir + manual
# gitignore parsing with the gitignore crate) requires two crates and reimplements
# logic that the ignore crate has battle-tested across large real-world codebases.
# Trade-off: transitive deps (crossbeam-channel, same_file, walkdir, globset, etc.)
# vs. a single well-audited crate. All transitive licenses are MIT/Apache-2.0/BSD.
# Decision: crossbeam-channel is a direct dep because NotifyWatcherAdapter
# explicitly owns the event channel between the notify callback and worker.
crossbeam-channel = "0.5"
ignore = "0.4.26"
# Decision: notify 8.x for OS FS event subscription (spec 06).
# License: CC0-1.0 (public domain) — added to deny.toml allow list.
notify = "8.2.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
# Decision: toml for the local project config file (.tower/config.toml).
# Why: idiomatic Rust config format; deserialized via the existing serde derive.
# License: MIT/Apache-2.0 (transitive deps winnow/toml_edit/etc.), already
# covered by deny.toml's allow list.
toml = "1.1.2"
# Decision: sha2 for SHA-256 content hashes on indexed files (FileMetadata.content_hash).
# Why: a 32-byte content fingerprint for change detection, computed in the fs adapter
# (infra layer) — the domain only holds the opaque bytes. MIT/Apache-2.0 (RustCrypto),
# covered by the deny.toml allow list.
sha2 = "0.11.0"
sled = "0.34"
# Decision: serde_json for MCP JSON-RPC 2.0 transport (spec 10a).
# Why: JSON-RPC is text/JSON; postcard (used by storage) is a binary format unsuitable
# for the wire protocol. serde_json is the de-facto standard, MIT/Apache-2.0 licensed.
# Trade-off: adds ~200 KB to binary vs. staying on postcard alone; unavoidable for
# JSON-RPC compliance (spec U1). Scoped to the adapters/mcp layer — domain/ is untouched.
serde_json = "1"

# Decision: directories for XDG-compliant global extension scope resolution.
# Why: resolves $XDG_DATA_HOME / ~/.local/share (and the spec's "ignore relative
# XDG_DATA_HOME" rule) cross-platform, used only at the binary/adapter edge to
# locate the global extensions dir. Domain stays untouched.
directories = "6"
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "time", "sync"] }
# clap (derive) for the binary CLI surface: subcommands + --version/--help.
# MIT/Apache-2.0; covered by deny.toml allow-list.
clap = { version = "4", features = ["derive"] }
# rustix: safe wrappers for setsid() (detach the auto-spawned daemon) and
# flock() (serialize the spawn race). Apache-2.0/MIT/BSD; deny allow-list.
rustix = { version = "1", features = ["process", "fs"] }
