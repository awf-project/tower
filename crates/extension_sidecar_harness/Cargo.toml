[package]
name = "extension_sidecar_harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Shared JSON-RPC sidecar harness helpers for Tower extensions"

[lib]
name = "extension_sidecar_harness"
path = "src/lib.rs"

[dependencies]
extension_protocol = { path = "../extension_protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
