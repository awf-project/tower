[package]
name = "fixture_abi_mismatch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Test fixture: plugin with wrong ABI version — used by 11c AC4 tests"

# Decision: cdylib so the wasm binary exports the four __plugin_* symbols.
# Excluded from default-members (same pattern as hello_plugin / plugin_ast).
[lib]
name = "fixture_abi_mismatch"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
plugin_sdk = { path = "../plugin_sdk", version = "0.1.0" }
