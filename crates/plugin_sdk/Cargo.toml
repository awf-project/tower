[package]
name = "plugin_sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tower plugin SDK — shared types, ABI, macros for wasm guest plugins"

[lib]
name = "plugin_sdk"
path = "src/lib.rs"

[dependencies]
# Decision: postcard as the guest ↔ host serialisation format.
# Why: postcard is already in the workspace, is no_std+alloc compatible (critical
# for wasm guests), produces compact binary frames, and has zero I/O surface.
# serde_json requires std and produces larger payloads; it is unsuitable for the
# tight wasm ABI boundary. postcard's `alloc` feature is sufficient for Vec output.
# Trade-off: binary (not human-readable) wire format between host and guest.
# The host (11c) uses postcard too; 12b maps to JSON/MCP only at the adapter layer.
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

# Re-export macros from the proc-macro crate so consumers write:
#   use plugin_sdk::{plugin_main, plugin_export};
# The proc-macro crate compiles on the host and is NOT linked into the wasm guest.
plugin_sdk_macros = { path = "../plugin_sdk_macros", version = "0.1.0" }

[dev-dependencies]
# trybuild is only used by the macro crate tests, but listed here in case
# plugin_sdk itself needs compile tests in future.
trybuild = "1"
