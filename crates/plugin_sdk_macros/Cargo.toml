[package]
name = "plugin_sdk_macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Proc-macro crate for the tower plugin SDK — compile-time host dep only"

# Decision: proc-macro = true so this crate compiles on the host and is NOT
# linked into the wasm guest. It generates code that plugin authors write to
# their wasm crates; the generated code itself is pure safe Rust.
# Trade-off: separate crate required by rustc proc-macro rules; re-exported
# through plugin_sdk so consumers only write `use plugin_sdk::plugin_main`.
[lib]
proc-macro = true
path = "src/lib.rs"

[dependencies]
# syn: full parse for attribute macros; proc-macro2/quote for token generation.
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Decision: no dev-dependencies here. Trybuild compile tests live in plugin_sdk
# where plugin_sdk itself is available as a dependency in the test's Cargo.toml.
# See crates/plugin_sdk/tests/ for the compile_pass / compile_fail suites.
