[package]
name = "fmt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Change-driven format trigger plugin — compiles to wasm32-wasip1"

# Decision: cdylib so the wasm binary exposes the four `__plugin_*` export
# symbols without a `_start` entrypoint — mirrors hello and ast.
# rlib is kept so host-side unit tests (`cargo test -p fmt`) compile.
# Trade-off: cdylib requires the host to call exports directly (which the
# 11c loader does).
[lib]
name = "fmt"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
plugin_sdk = { path = "../../crates/plugin_sdk", version = "0.1.0" }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
