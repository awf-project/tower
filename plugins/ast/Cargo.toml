[package]
name = "ast"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reference Tree-sitter AST plugin — compiles to wasm32-wasip1 (spec 12c)"

# Decision: cdylib (same as hello) so the wasm binary exposes the four
# `__plugin_*` symbols as wasm exports without a `_start` entrypoint.
# rlib is kept so host-side unit tests (`cargo test -p ast`) compile.
[lib]
name = "ast"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# The old stub binary is removed; the cdylib lib replaces it.
# The #[plugin_main] macro generates the wasm entry surface.

[dependencies]
plugin_sdk = { path = "../../crates/plugin_sdk", version = "0.1.0" }
# Tree-sitter per 12a recipe: pin both crates together (minor upgrade = API mismatch risk).
# tree-sitter 0.25.x + tree-sitter-rust 0.23.x are the tested combination (12a/12b).
# tree-sitter-go 0.25.0 and tree-sitter-php 0.24.2 added for spec 12d.
# All three grammar crates use tree-sitter-language 0.1 ABI which is compatible
# with tree-sitter 0.25.x (they all export LANGUAGE: LanguageFn).
# License: MIT (both grammar crates) — permissive, compatible with EUPL-1.2 (deny.toml).
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.25"
tree-sitter-php = "0.24"
# Decision: postcard + serde for SymbolIndex serialisation (spec 12d index).
# Why: same wire format already used by plugin_sdk ↔ host; zero extra wasm size overhead
#      since postcard is already linked for plugin_sdk. serde derive removes boilerplate.
# Trade-off: direct dep duplication with plugin_sdk; versions must stay in sync.
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# None required — host-side tests use only the lib's public API.

# Decision: do NOT add [profile.release] here — cargo ignores profiles in
# non-root packages and warns. The workspace root Cargo.toml owns all profiles.
# The wasm size target (~1.2 MB release per 12a) is met with opt-level="s" set
# at the workspace level (see workspace Cargo.toml).
