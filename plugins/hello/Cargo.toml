[package]
name = "hello"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Minimal example tower plugin — compiles to wasm32-wasip1 (AC1/AC2)"

# Decision: hello is a cdylib so the wasm binary exposes the four
# `__plugin_*` symbols as wasm exports. A `bin` target works too (wasm32-wasip1
# supports `_start`), but `cdylib` is more representative of how real plugins
# are distributed (no _start entrypoint; pure export symbols).
# Trade-off: cdylib requires the host to call exports directly (which 11c does).
[lib]
name = "hello"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
plugin_sdk = { path = "../../crates/plugin_sdk", version = "0.1.0" }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
