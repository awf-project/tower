[package]
publish = false
name = "debug_extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Debug sidecar extension scaffold"

[[bin]]
name = "debug_extension"
path = "src/main.rs"

[dependencies]
extension_protocol = { path = "../../crates/extension_protocol" }
extension_sidecar_harness = { path = "../../crates/extension_sidecar_harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
