[package]
publish = false
name = "semantic_context_extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Semantic context sidecar extension"

[lib]
path = "src/lib.rs"

[dependencies]
extension_protocol = { path = "../../crates/extension_protocol" }
extension_sidecar_harness = { path = "../../crates/extension_sidecar_harness" }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.48.0", features = ["rt", "time"] }

[dev-dependencies]
core_engine = { path = "../../crates/core_engine" }
tempfile = "3"
tokio = { version = "1.48.0", features = ["rt", "time"] }
toml = "1.1.2"
