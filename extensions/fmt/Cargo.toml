[package]
publish = false  # internal crate; never published to a registry
name = "fmt_extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Formatter sidecar extension — subscribes to fileChanged and triggers the host format queue"

[[bin]]
name = "fmt_extension"
path = "src/main.rs"

[dependencies]
extension_protocol = { path = "../../crates/extension_protocol" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
