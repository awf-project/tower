[package]
publish = false
name = "lint_extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lint sidecar extension parser surface"

[lib]
name = "lint_extension"
path = "src/lib.rs"

[[bin]]
name = "lint_extension"
path = "src/main.rs"

[dependencies]
core_engine = { path = "../../crates/core_engine" }
extension_protocol = { path = "../../crates/extension_protocol" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
