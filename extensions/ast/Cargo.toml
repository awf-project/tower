[package]
publish = false  # internal crate; never published to a registry
name = "ast_extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native tree-sitter AST sidecar extension (spec 26) — replaces the WASM ast plugin"

[[bin]]
name = "ast_extension"
path = "src/main.rs"

[dependencies]
extension_protocol = { path = "../../crates/extension_protocol" }
serde_json = "1"
# Tree-sitter for native parsing — same grammar set as plugins/ast (spec 12d).
# These compile natively; no WASI SDK, no wasm32 target needed.
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.25"
tree-sitter-php = "0.24"
# postcard + serde for SymbolIndex serialisation — same wire format as plugins/ast.
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
