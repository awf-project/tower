[package]
publish = false
name = "agent_memory_extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent memory sidecar extension"

[lib]
name = "agent_memory_extension"
path = "src/lib.rs"

[[bin]]
name = "agent_memory_extension"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4.42"
regex = "1"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
extension_protocol = { path = "../../crates/extension_protocol" }
extension_sidecar_harness = { path = "../../crates/extension_sidecar_harness" }

tokio = { version = "1.54.1", features = ["rt", "time", "net", "macros"] }

[dev-dependencies]
toml = "1.1.2"
