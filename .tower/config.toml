# Local tower project configuration.
# Schema is strict: unknown keys abort startup (exit 1).

# Language servers, keyed by language. Each file routes to its server by
# extension. idle_timeout_secs is optional (absent = sessions stay resident).
[lsp]
# idle_timeout_secs = 300

[lsp.rust]
command = "rust-analyzer"
extensions = ["rs"]

[lint.rust]
command = "cargo"
args = ["clippy", "--message-format=json", "--quiet"]
extensions = ["rs"]
format = "rustc-json"
target = "none"

[debug.rust]
command = "target/debug/fixture_debug_adapter"
args = []
extensions = ["rs"]
adapter_type = "fixture"
default_timeout_secs = 5
idle_ttl_secs = 300

[debug.record]
backend = "rr"
trace_dir = ".tower/traces"
ttl_secs = 86400
max_traces = 25
record_timeout_secs = 30

[extensions]
# Extension manifest names to skip loading, e.g. ["ast"].
# Disabled extensions are not loaded and expose no tools or event hooks.
disabled = []

# [formatter.tools.<id>] — external formatters run by the host format queue when a
# file changes. mode = "filter" (default, stdin->stdout) or "inplace".
# `{path}` is substituted with the file path (filter) or temp copy (inplace).
# Uninstalled tools are skipped, so unused entries are harmless.

[formatter.tools.rustfmt]
argv = ["rustfmt", "--edition", "2024"]
extensions = ["rs"]

[formatter.tools.prettier_markdown]
argv = ["prettier", "--parser", "markdown"]
extensions = ["md", "markdown"]
