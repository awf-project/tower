[workspace]
resolver = "2"
members = [
    "crates/core_engine",
    "crates/extension_sidecar_harness",
    "crates/extension_protocol",
    "extensions/test_helper",
    "extensions/fixtures/hang_forever",
    "extensions/fixtures/crash_on_init",
    "extensions/fixtures/exit_nonzero",
    "extensions/fixtures/garbage_frames",
    "extensions/fixtures/ignore_shutdown",
    "extensions/fixtures/debug_adapter",
    "extensions/fixtures/lsp_server",
    "extensions/fixtures/slow_start",
    "extensions/ast",
    "extensions/hello",
    "extensions/lsp",
    "extensions/fmt",
    "extensions/lint",
    "extensions/debug",
    "extensions/semantic_context",
    "extensions/agent_memory",
]

default-members = [
    "crates/core_engine",
    "crates/extension_sidecar_harness",
    "crates/extension_protocol",
    # test_helper extension binary — compiled natively by the pre-test
    # `cargo build --workspace --bins` step so spec 23 tests can spawn it.
    "extensions/test_helper",
    # Spec 24 fault-isolation fixtures — compiled natively by the pre-test
    # build step so integration tests can locate them via target/debug/.
    "extensions/fixtures/hang_forever",
    "extensions/fixtures/crash_on_init",
    "extensions/fixtures/exit_nonzero",
    "extensions/fixtures/garbage_frames",
    # Regression fixture: completes init then ignores `shutdown` (bug #1, shutdown deadlock).
    "extensions/fixtures/ignore_shutdown",
    # F004 deterministic Debug Adapter Protocol fixture for debug e2e tests.
    "extensions/fixtures/debug_adapter",
    # Built before tests so both the host and LSP sidecar suites can spawn it.
    "extensions/fixtures/lsp_server",
    # B001 deterministic slow-start fixture for daemon readiness tests.
    "extensions/fixtures/slow_start",
    # Spec 26 native extensions — compiled natively (no WASM, no WASI SDK).
    "extensions/ast",
    "extensions/hello",
    # Spec 27 LSP sidecar extension — compiled natively.
    "extensions/lsp",
    # Fmt sidecar extension — compiled natively so e2e tests can locate the binary.
    "extensions/fmt",
    # F002 lint sidecar extension.
    "extensions/lint",
    # F004 debug sidecar extension.
    "extensions/debug",
    # F016 semantic-context sidecar extension.
    "extensions/semantic_context",
    # F017 agent-memory sidecar extension.
    "extensions/agent_memory",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"

[profile.release]
opt-level = "s"
