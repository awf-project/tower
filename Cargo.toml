[workspace]
resolver = "2"
members = [
    "crates/core_engine",
    "crates/plugin_sdk",
    "crates/plugin_sdk_macros",
    "crates/plugin_ast",
    "crates/hello_plugin",
]

# Decision: plugin_ast and hello_plugin target wasm32-wasip1 and are excluded
# from default-members so host `cargo test` / `cargo build` ignores them.
# Why: mirrors the plugin_ast precedent (spec OP1). The wasm build is verified
# explicitly via `cargo build --target wasm32-wasip1 -p hello_plugin`.
# Trade-off: `cargo test --workspace` would fail (wasm target not available on
# the host default build); use `cargo test --workspace --exclude hello_plugin
# --exclude plugin_ast` or rely on default-members for CI.
default-members = [
    "crates/core_engine",
    "crates/plugin_sdk",
    "crates/plugin_sdk_macros",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "EUPL-1.2"
