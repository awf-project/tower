[workspace]
resolver = "2"
members = [
    "crates/core_engine",
    "crates/extension_protocol",
    # Test-only sidecar extension binary for spec 23 integration tests.
    "extensions/test_helper",
    # Spec 24 fault-isolation fixtures (native binaries, not WASM).
    "extensions/fixtures/hang_forever",
    "extensions/fixtures/crash_on_init",
    "extensions/fixtures/exit_nonzero",
    "extensions/fixtures/garbage_frames",
    # Regression fixture: completes init then ignores `shutdown` (forces host kill escalation).
    "extensions/fixtures/ignore_shutdown",
    # Spec 26 native extensions (native binaries, no WASM).
    "extensions/ast",
    "extensions/hello",
    # Spec 27 LSP sidecar extension (native binary, no WASM).
    "extensions/lsp",
    # Fmt sidecar extension — subscribes to fileChanged and triggers the format queue.
    "extensions/fmt",
]

default-members = [
    "crates/core_engine",
    "crates/extension_protocol",
    # test_helper extension binary — compiled natively, part of default build
    # so that `cargo test --workspace` can locate the binary for spec 23 tests.
    "extensions/test_helper",
    # Spec 24 fault-isolation fixtures — compiled natively so that spec 24
    # integration tests can locate them via the same target/debug/ path convention.
    "extensions/fixtures/hang_forever",
    "extensions/fixtures/crash_on_init",
    "extensions/fixtures/exit_nonzero",
    "extensions/fixtures/garbage_frames",
    # Regression fixture: completes init then ignores `shutdown` (bug #1, shutdown deadlock).
    "extensions/fixtures/ignore_shutdown",
    # Spec 26 native extensions — compiled natively (no WASM, no WASI SDK).
    "extensions/ast",
    "extensions/hello",
    # Spec 27 LSP sidecar extension — compiled natively.
    "extensions/lsp",
    # Fmt sidecar extension — compiled natively so e2e tests can locate the binary.
    "extensions/fmt",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"

[profile.release]
opt-level = "s"
